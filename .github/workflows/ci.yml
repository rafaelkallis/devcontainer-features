name: CI

on:
  push:
    branches: "main"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-features:
    outputs:
      relevant-features: ${{ steps.list-features.outputs.relevant-features }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list-features
        uses: devcontainers-community/list-features@v2

  test-autogenerated:
    needs: list-features
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.list-features.outputs.relevant-features) }}
        baseImage:
          - "mcr.microsoft.com/devcontainers/base:ubuntu"
          - "mcr.microsoft.com/devcontainers/base:debian"
          - "mcr.microsoft.com/devcontainers/base:alpine"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create mock host config files (required for mount features)
        run: |
          mkdir -p ~/.claude ~/.codex ~/.azure ~/.config/gh
          echo "{}" > ~/.claude.json

      - name: Generating tests for '${{ matrix.feature.id }}' against '${{ matrix.baseImage }}'
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature.id }} -i ${{ matrix.baseImage }}
  
  test-scenarios:
    needs: list-features
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.list-features.outputs.relevant-features) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create mock host config files (required for mount features)
        run: |
          mkdir -p ~/.claude ~/.codex ~/.azure ~/.config/gh
          echo "{}" > ~/.claude.json

      - name: Testing scenarios for '${{ matrix.feature.id }}'
        run: devcontainer features test -f ${{ matrix.feature.id }} --skip-autogenerated
  
  test-global:
    needs: list-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create mock host config files (required for mount features)
        run: |
          mkdir -p ~/.claude ~/.codex ~/.azure ~/.config/gh
          echo "{}" > ~/.claude.json

      - name: Testing global scenarios
        run: devcontainer features test --global-scenarios-only

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Shellcheck install scripts and tests
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
          severity: warning

      - name: Validate feature manifests
        run: |
          for feature in src/*/; do
            devcontainer features validate -f "$feature"
          done

  release:
    needs: [test-autogenerated, test-scenarios, test-global, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli
      
      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: true
          base-path-to-features: ./src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
